<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>静止画の書き出し用（開発専用）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas><script type="module">
// 3Dが使えない端末向けの静止画と、切り分け図を書き出すためのページ。scripts/render-stills.mjs から開く。
import { IceStage } from '/src/ice/stage.js';
const q = new URLSearchParams(location.search);
const s = new IceStage(document.getElementById('c'));
const word = q.get('w') || '';
if (word) await document.fonts.load('900 100px "Zen Old Mincho"', word);
s.resize();
s.setPalette(q.get('p') || 'day', 0);
s.shared.uBgEdge.value.copy(s.shared.uBg.value); // ページの地色とつながるよう、周辺の陰りは付けない
s.setText((ctx, w, h) => {
  if (!word) return;
  if (q.get('v')) { // 縦に積む
    const chars = [...word]; const size = Math.min(w * 0.8, (h * 0.92) / chars.length);
    ctx.font = `900 ${size}px "Zen Old Mincho"`;
    chars.forEach((ch, i) => ctx.fillText(ch, (w - ctx.measureText(ch).width) / 2, h * 0.04 + size * (i + 0.86)));
    return;
  }
  const size = Math.min(w * 0.9 / [...word].length, h * 0.6);
  ctx.font = `900 ${size}px "Zen Old Mincho"`;
  ctx.fillText(word, (w - ctx.measureText(word).width) / 2, h / 2 + size * 0.36);
});
s.setShape(q.get('s') || 'block', { instant: true });
s.setCloud(+(q.get('c') || 0));
s.setLayout({ x: 0, y: 0, scale: +(q.get('k') || 0.8) });
s.lockQuality = true;
s.still = true; s.autoSpin = +(q.get('r') || 0);
s.renderOnce(); s.renderOnce();
window.__ready = true;
</script></body></html>
