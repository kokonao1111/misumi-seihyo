<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません｜三澄製氷</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/misumi-seihyo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Old+Mincho:wght@900&display=swap" rel="stylesheet">
  <style>
    /* どの階層で表示されても崩れないよう、このページだけは1枚で完結させている */
    html, body { height: 100%; margin: 0; }
    body { display: grid; align-content: center; padding: 0 clamp(1.25rem, 5vw, 5rem); background: #e9eff1; color: #0c1a22; font-family: "Zen Kaku Gothic New", sans-serif; line-height: 2; letter-spacing: 0.06em; -webkit-font-smoothing: antialiased; }
    h1 { margin: 0; font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: clamp(3rem, 13vw, 11rem); line-height: 1.2; letter-spacing: 0.04em; }
    p { margin: 2rem 0 0; max-width: 30em; font-weight: 500; }
    a { display: inline-block; margin-top: 2.5rem; padding: 1rem 2.5rem; border: 1px solid #0c1a22; color: inherit; text-decoration: none; font-weight: 700; font-size: 0.9375rem; letter-spacing: 0.14em; transition: background 0.5s, color 0.5s; }
    a:hover, a:focus-visible { background: #0c1a22; color: #e9eff1; }
    small { position: fixed; left: clamp(1.25rem, 5vw, 5rem); top: 1.5rem; font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: 1.375rem; letter-spacing: 0.12em; }
  </style>
</head>
<body>
  <small>三澄製氷</small>
  <main>
    <h1>溶けました。</h1>
    <p>お探しのページは、見つかりませんでした。移したか、なくなったか、もともと無かったかのどれかです。氷と同じで、跡は残っていません。</p>
    <a href="/misumi-seihyo/">トップへ戻る</a>
  </main>
</body>
</html>
